<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CuBiC - Module Load Test</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #0f0;
      padding: 20px;
    }
    .pass { color: #0f0; }
    .fail { color: #f00; }
  </style>
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
        "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/webxr/VRButton": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/webxr/VRButton.js",
        "three/examples/jsm/webxr/XRControllerModelFactory": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/webxr/XRControllerModelFactory.js"
      }
    }
  </script>
</head>
<body>
  <h1>CuBiC Module Load Test</h1>
  <div id="results"></div>

  <script type="module">
    const results = document.getElementById('results');

    function log(message, passed = true) {
      const div = document.createElement('div');
      div.className = passed ? 'pass' : 'fail';
      div.textContent = `${passed ? '✓' : '✗'} ${message}`;
      results.appendChild(div);
    }

    try {
      log('Testing module imports...');

      // Test Three.js
      const THREE = await import('three');
      log('Three.js loaded');

      // Test constants
      const constants = await import('./js/constants.js');
      log(`Constants loaded (GRID_SIZE: ${constants.GRID_SIZE})`);

      // Test Grid
      const { Grid } = await import('./js/Grid.js');
      log(`Grid module loaded`);

      // Test ShipManager
      const { ShipManager } = await import('./js/ShipManager.js');
      log(`ShipManager module loaded`);

      // Test VRControls
      const { VRControls } = await import('./js/VRControls.js');
      log(`VRControls module loaded`);

      // Test InputHandler
      const { InputHandler } = await import('./js/InputHandler.js');
      log(`InputHandler module loaded`);

      // Test UIManager
      const { UIManager } = await import('./js/UIManager.js');
      log(`UIManager module loaded`);

      // Test AutoPlay
      const { AutoPlay } = await import('./js/AutoPlay.js');
      log(`AutoPlay module loaded`);

      // Test Game
      const { Game } = await import('./js/Game.js');
      log(`Game module loaded`);

      log('');
      log('All modules loaded successfully! 🎉');
      log('');
      log('The refactored game should work. Open index.html to play!');

    } catch (err) {
      log(`ERROR: ${err.message}`, false);
      console.error(err);
    }
  </script>
</body>
</html>
